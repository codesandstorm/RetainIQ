[project]
name = "retainiq"
version = "0.1.0"
description = "Prepaid telecom retention decision engine: ranked, costed, explainable retention worklists with control-group measurement."
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# tasks.py runs fixed, hard-coded tool commands via subprocess.
"tasks.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tasks.py"]
